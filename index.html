<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms - Lets learn it | Video 6</title>
</head>
<body>
    <h1> TELL ME ABOUT YOURSELF... ARE YOU AN ALIEN...</h1>
    <form action="post">
        <div>
            <label for="username"> Enter your Name</label>
            <input type="text" id="username" name="username" placeholder="Enter your username">
        </div>
        <div>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
        </div>

        <div>
            <input type="checkbox" id="subscribe" name="subscribe" value="yes">
            <label for="subscribe">I AM A STUPID YAYY!!! </label>
        </div>
        <div>
            <label for="comment"> Enter your Comment </label>
            <textarea id="comment" name="comment" rows="4" cols="50"></textarea>
        </div>

        <div>
            <select name="nicknames">
                <option value="IDIOT">IDIOT</option>
                <option value="SUAR">SUAR</option>
                <option value="NASHEDI">NASHEDI</option>
            </select>
        </div>
    </form>
</body>
</html>
