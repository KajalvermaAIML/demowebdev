<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms - Lets learn it | Video 6</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #D4AF37; /* Metallic Golden */
            background-image: radial-gradient(circle at 50% 30%, #F5E086 0%, #D4AF37 50%, #AA7A1E 100%);
            color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .top-nav {
            position: absolute;
            top: 1.5rem;
            right: 2rem;
        }

        .btn-nav-login {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.9);
            color: #855806;
            padding: 0.6rem 1.25rem;
            border-radius: 9999px;
            font-weight: 700;
            font-size: 0.9rem;
            text-decoration: none;
            border: 1.5px solid rgba(212, 175, 55, 0.8);
            box-shadow: 0 4px 15px rgba(133, 88, 6, 0.25);
            transition: all 0.2s ease;
        }

        .btn-nav-login:hover {
            background: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(133, 88, 6, 0.35);
        }

        .form-container {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(212, 175, 55, 0.6);
            border-radius: 20px;
            padding: 2.5rem;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 20px 45px rgba(146, 107, 13, 0.35);
            margin-top: 2rem;
        }

        h1 {
            font-size: 1.45rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            text-align: center;
            letter-spacing: 0.5px;
            line-height: 1.4;
            color: #855806;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.4rem;
            font-size: 0.95rem;
            font-weight: 600;
            color: #333333;
        }

        input[type="text"], textarea, select {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            border: 1.5px solid #d4af37;
            background: #ffffff;
            color: #1a1a1a;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus, textarea:focus, select:focus {
            border-color: #b8860b;
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.3);
        }

        .radio-group, .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-top: 0.5rem;
        }

        .radio-group label, .checkbox-group label {
            display: inline;
            margin-bottom: 0;
            cursor: pointer;
            color: #444444;
        }

        input[type="radio"], input[type="checkbox"] {
            accent-color: #b8860b;
            cursor: pointer;
            width: 16px;
            height: 16px;
        }

        select option {
            background: #ffffff;
            color: #1a1a1a;
        }
    </style>
</head>
<body>
    <!-- Top Login Link -->
    <div class="top-nav">
        <a href="./login.html" class="btn-nav-login">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                <polyline points="10 17 15 12 10 7"/>
                <line x1="15" y1="12" x2="3" y2="12"/>
            </svg>
            Go to Login Page
        </a>
    </div>

    <div class="form-container">
        <h1>TELL ME ABOUT YOURSELF... ARE YOU AN ALIEN...</h1>
        <form action="post">
            <div class="form-group">
                <label for="username">Enter your Name</label>
                <input type="text" id="username" name="username" placeholder="Enter your username">
            </div>

            <div class="form-group">
                <label>Select Gender</label>
                <div class="radio-group">
                    <input type="radio" id="male" name="gender" value="male">
                    <label for="male">Male</label>
                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">Female</label>
                </div>
            </div>

            <div class="form-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="subscribe" name="subscribe" value="yes">
                    <label for="subscribe">I AM A STUPID YAYY!!!</label>
                </div>
            </div>

            <div class="form-group">
                <label for="comment">Enter your Comment</label>
                <textarea id="comment" name="comment" rows="4" placeholder="Type your thoughts..."></textarea>
            </div>

            <div class="form-group">
                <label for="nicknames">Select Nickname</label>
                <select id="nicknames" name="nicknames">
                    <option value="IDIOT">IDIOT</option>
                    <option value="SUAR">SUAR</option>
                    <option value="NASHEDI">NASHEDI</option>
                </select>
            </div>
        </form>
    </div>
</body>
</html>
