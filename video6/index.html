<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms - Lets learn it | Video 6</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #F4C2C2; /* Baby Pink */
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .form-container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 2.5rem;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(225, 112, 140, 0.2);
        }

        h1 {
            font-size: 1.45rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            text-align: center;
            letter-spacing: 0.5px;
            line-height: 1.4;
            color: #db2777; /* Deep Pink Header */
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.4rem;
            font-size: 0.95rem;
            font-weight: 600;
            color: #334155;
        }

        input[type="text"], textarea, select {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            border: 1.5px solid #f9a8d4;
            background: #ffffff;
            color: #1e293b;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus, textarea:focus, select:focus {
            border-color: #ec4899;
            box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.2);
        }

        .radio-group, .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-top: 0.5rem;
        }

        .radio-group label, .checkbox-group label {
            display: inline;
            margin-bottom: 0;
            cursor: pointer;
            color: #475569;
        }

        input[type="radio"], input[type="checkbox"] {
            accent-color: #ec4899;
            cursor: pointer;
            width: 16px;
            height: 16px;
        }

        select option {
            background: #ffffff;
            color: #1e293b;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>TELL ME ABOUT YOURSELF... ARE YOU AN ALIEN...</h1>
        <form action="post">
            <div class="form-group">
                <label for="username">Enter your Name</label>
                <input type="text" id="username" name="username" placeholder="Enter your username">
            </div>

            <div class="form-group">
                <label>Select Gender</label>
                <div class="radio-group">
                    <input type="radio" id="male" name="gender" value="male">
                    <label for="male">Male</label>
                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">Female</label>
                </div>
            </div>

            <div class="form-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="subscribe" name="subscribe" value="yes">
                    <label for="subscribe">I AM A STUPID YAYY!!!</label>
                </div>
            </div>

            <div class="form-group">
                <label for="comment">Enter your Comment</label>
                <textarea id="comment" name="comment" rows="4" placeholder="Type your thoughts..."></textarea>
            </div>

            <div class="form-group">
                <label for="nicknames">Select Nickname</label>
                <select id="nicknames" name="nicknames">
                    <option value="IDIOT">IDIOT</option>
                    <option value="SUAR">SUAR</option>
                    <option value="NASHEDI">NASHEDI</option>
                </select>
            </div>
        </form>
    </div>
</body>
</html>
